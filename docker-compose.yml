services:
  openlist:
    image: 'openlistteam/openlist:v4.2.5'
    container_name: openlist
    user: '1000:1000' # Please replace `0:0` with the actual user ID and group ID you want to use to run OpenList.
    volumes:
      - './openlist-data:/opt/openlist/data'
      - '/home/mickey:/local'
    ports:
      - '2000:5244'
    environment:
      - UMASK=022
    restart: unless-stopped

  meilisearch:
    # 固定补丁版本，升级前请先导出 dump 并阅读官方升级说明。
    image: getmeili/meilisearch:v1.53.0
    container_name: meilisearch
    # OpenList 容器通过 http://meilisearch:7700 访问；宿主机/Caddy 通过此地址访问。
    # 仅绑定回环地址，避免将管理 API 直接暴露到局域网或公网。
    ports:
      - '2700:7700'
    environment:
      MEILI_ENV: production
      MEILI_HTTP_ADDR: '0.0.0.0:7700'
      MEILI_MASTER_KEY: '' # 使用 openssl.exe -l rand32 生成
      MEILI_DB_PATH: /meili_data
      MEILI_DUMP_DIR: /meili_dumps
      MEILI_SNAPSHOT_DIR: /meili_snapshots
      # 每 24 小时生成一次快照；只保留最新快照。
      MEILI_SCHEDULE_SNAPSHOT: '86400'
      MEILI_LOG_LEVEL: INFO
      # 默认最多使用约 2/3 可用内存、1/2 CPU 线程，通常比固定值更适合未知规格的宿主机。
      # 如需限制，可按实际资源取消注释：
      # MEILI_MAX_INDEXING_MEMORY: '2GiB'
      # MEILI_MAX_INDEXING_THREADS: '2'
    command:
      - /bin/meilisearch
      - --no-analytics
    volumes:
      - './meilisearch/data:/meili_data'
      - './meilisearch/dumps:/meili_dumps'
      - './meilisearch/snapshots:/meili_snapshots'
    restart: unless-stopped
    stop_grace_period: 1m

  filebrowser:
    image: gtstef/filebrowser:1.5.1-stable-slim
    container_name: filebrowser-quantum
    user: "1000:1000"
    ports:
      - "2100:80"
    volumes:
      # 配置、数据库和上传/归档缓存；必须持久化以支持容器重建后的状态恢复。
      - ./filebrowser-data:/home/filebrowser/data
      # 与 OpenList 的 /local 和 /nas 使用同一份宿主机数据。
      - /home/mickey:/local:rw
    environment:
      FILEBROWSER_CONFIG: /home/filebrowser/data/config.yaml
      FILEBROWSER_DATABASE: /home/filebrowser/data/database.db
      TZ: Asia/Shanghai
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 15s
